logLevel: info
logDestinations: [stdout]
readTimeout: 5s
writeTimeout: 5s
authMethod: internal
# Populated by indexed MTX_AUTHINTERNALUSERS_* variables from Compose.
# Keep this list empty; never store real secrets here.
authInternalUsers: []
api: no
metrics: no
pprof: no
playback: no
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: yes
# TLS is terminated by the Coolify Traefik TCP router.
rtmpEncryption: "no"
rtmpAddress: :1935
hls: no
webrtc: no
srt: no
pathDefaults:
  overridePublisher: no
paths:
  live:
