services:
  mediamtx:
    image: bluenviron/mediamtx:1.15.3
    restart: unless-stopped
    ports:
      - "${RTMP_BIND_IP:-0.0.0.0}:${RTMP_PORT:-1935}:1935/tcp"
    environment:
      # MediaMTX 1.15.3 requires indexed variables for lists of objects.
      MTX_AUTHINTERNALUSERS_0_USER: ${PUBLISH_USER:?Set PUBLISH_USER}
      MTX_AUTHINTERNALUSERS_0_PASS: ${PUBLISH_PASSWORD:?Set PUBLISH_PASSWORD}
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_PATH: live

      MTX_AUTHINTERNALUSERS_1_USER: ${READ_USER:-relay}
      MTX_AUTHINTERNALUSERS_1_PASS: ${READ_PASSWORD:?Set READ_PASSWORD}
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: read
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_PATH: live
    volumes:
      - type: bind
        source: ${MEDIAMTX_CONFIG:-/opt/basket-live/config/mediamtx.yml}
        target: /mediamtx.yml
        read_only: true
        bind:
          create_host_path: false
    networks: [stream]
    mem_limit: 512m
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  relay:
    image: ${RELAY_IMAGE:?Set RELAY_IMAGE to your published Docker Hub image}
    restart: unless-stopped
    init: true
    depends_on:
      mediamtx:
        condition: service_started
      web:
        condition: service_healthy
    environment:
      INPUT_URL: rtsp://mediamtx:8554/live
      READ_USER: ${READ_USER:-relay}
      READ_PASSWORD: ${READ_PASSWORD:?Set READ_PASSWORD}
      YOUTUBE_RTMPS_URL: ${YOUTUBE_RTMPS_URL:-rtmps://a.rtmps.youtube.com:443/live2}
      YOUTUBE_STREAM_KEY: ${YOUTUBE_STREAM_KEY:?Set YOUTUBE_STREAM_KEY}
      WIDTH: ${WIDTH:-1920}
      HEIGHT: ${HEIGHT:-1080}
      FPS: ${FPS:-30}
      VIDEO_BITRATE: ${VIDEO_BITRATE:-6000k}
      ENCODER_PRESET: ${ENCODER_PRESET:-veryfast}
      ENCODER_THREADS: ${ENCODER_THREADS:-4}
      WAITING_IMAGE: ${WAITING_IMAGE:-/assets/waiting.png}
      OVERLAY_IMAGE: /data/overlay/overlay.png
      RELAY_STATUS_FILE: /data/status/relay.json
      RELAY_CONTROL_FILE: /data/overlay/broadcast.json
      STALE_SECONDS: ${STALE_SECONDS:-1.5}
      READY_FRAMES: ${READY_FRAMES:-5}
      OUTPUT_STALL_SECONDS: ${OUTPUT_STALL_SECONDS:-20}
    volumes:
      - overlay-data:/data/overlay:ro
      - relay-status:/data/status
      - type: bind
        source: ${ASSETS_DIR:-./assets}
        target: /assets
        read_only: true
    networks: [stream]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 1536m
    cpus: ${RELAY_CPUS:-5.0}
    pids_limit: 128
    stop_grace_period: 15s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, /app/stream_controller.py, --healthcheck]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
    logging: *logs

  web:
    image: ${RELAY_IMAGE:?Set RELAY_IMAGE to your published Docker Hub image}
    restart: unless-stopped
    init: true
    entrypoint: [gunicorn, "--bind=0.0.0.0:8080", "--workers=1", "--threads=4", "--timeout=30", "web.app:create_app()"]
    # Coolify routes to the container port; do not reserve a host port.
    expose:
      - "8080"
    environment:
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
      WEB_SECRET_KEY: ${WEB_SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_EMAILS: ${GOOGLE_ALLOWED_EMAILS:-}
      INGEST_PUBLIC_URL: ${INGEST_PUBLIC_URL:-}
      INGEST_PROTOCOL: rtmp
      INGEST_PORT: ${RTMP_PORT:-1935}
      INGEST_STREAM_KEY: live
      PUBLISH_USER: ${PUBLISH_USER:?Set PUBLISH_USER}
      PUBLISH_PASSWORD: ${PUBLISH_PASSWORD:?Set PUBLISH_PASSWORD}
      WIDTH: ${WIDTH:-1920}
      HEIGHT: ${HEIGHT:-1080}
      RELAY_CONTROL_FILE: /data/overlay/broadcast.json
      OVERLAY_BASE_IMAGE: ${OVERLAY_BASE_IMAGE:-/assets/overlay.png}
    volumes:
      - overlay-data:/data/overlay
      - relay-status:/data/status:ro
      - type: bind
        source: ${ASSETS_DIR:-./assets}
        target: /assets
        read_only: true
    networks: [stream]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 32
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 5
    logging: *logs

volumes:
  overlay-data:
  relay-status:

networks:
  stream:
