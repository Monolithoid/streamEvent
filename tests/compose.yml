# Loopback-only, separate project and ports; never uses production credentials.
services:
  mediamtx:
    image: bluenviron/mediamtx:1.15.3
    ports:
      - "127.0.0.1:19350:1935"
      - "127.0.0.1:18554:8554"
    environment:
      # Regression coverage for production account loading (no JSON list variable).
      MTX_AUTHINTERNALUSERS_0_USER: phone
      MTX_AUTHINTERNALUSERS_0_PASS: test-publish-only
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_PATH: live
      MTX_AUTHINTERNALUSERS_1_USER: relay
      MTX_AUTHINTERNALUSERS_1_PASS: test-read-only
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: read
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_PATH: live
      MTX_AUTHINTERNALUSERS_2_USER: sink
      MTX_AUTHINTERNALUSERS_2_PASS: test-sink-only
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_0_PATH: program
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_1_ACTION: read
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_1_PATH: program
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
