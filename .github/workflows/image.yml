name: Test and publish relay
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'monolithoid/streamevent-relay' }}
  # Docker Hub short description: 100 bytes max (accented characters count double).
  SHORT_DESCRIPTION: "Relais vers YouTube pour le basket 3×3 : MediaMTX, FFmpeg et régie web"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: sh -n scripts/deploy_rtmps_certificate.sh
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example -f docker-compose.rtmps.yml config --quiet

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Hub repository
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REPOSITORY: ${{ env.DOCKERHUB_IMAGE }}
        shell: bash
        run: |
          if [[ ! "$IMAGE_REPOSITORY" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$ ]]; then
            echo '::error::Set the repository variable DOCKERHUB_IMAGE to your Docker Hub namespace/repository, without registry or tag.'
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: basket-relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test actual container before publication
        run: python tests/integration.py --image basket-relay:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streaming-validation
          path: test-results/
          retention-days: 7
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Pull requests build/test without needing any registry credentials.
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=streamEvent relay
            org.opencontainers.image.description=${{ env.SHORT_DESCRIPTION }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            org.opencontainers.image.vendor=monolithoid
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose Docker Hub overview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RAW_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        shell: bash
        run: |
          # Docker Hub cannot resolve the README's relative paths: images point to the
          # raw file of this commit, other links to the file on GitHub.
          python3 - README.md "$RUNNER_TEMP/dockerhub-README.md" <<'PY'
          import os, re, sys
          src, dst = sys.argv[1], sys.argv[2]
          repo, raw, ref = os.environ["REPO_URL"], os.environ["RAW_URL"], os.environ["GITHUB_REF_NAME"]
          text = open(src, encoding="utf-8").read()
          def absolute(path):
              path = path[2:] if path.startswith("./") else path
              if re.search(r"\.(png|jpe?g|gif|svg|webp)$", path.split("#")[0], re.I):
                  return f"{raw}/{path}"
              return f"{repo}/blob/{ref}/{path}"
          relative = r"(?!https?://|mailto:|#|/)([^)\"\s]+)"
          text = re.sub(r"(\]\()" + relative, lambda m: m.group(1) + absolute(m.group(2)), text)
          text = re.sub(r"(src=\")" + relative, lambda m: m.group(1) + absolute(m.group(2)), text)
          text += (
              "\n\n---\n\n## Liens\n\n"
              f"- Code source et documentation : [{os.environ['GITHUB_REPOSITORY']}]({repo})\n"
              f"- Dockerfile : [Dockerfile]({repo}/blob/{ref}/Dockerfile)\n"
              f"- Signaler un problème : [issues GitHub]({repo}/issues)\n"
          )
          open(dst, "w", encoding="utf-8").write(text)
          PY

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: ${{ env.SHORT_DESCRIPTION }}
          readme-filepath: ${{ runner.temp }}/dockerhub-README.md
