name: Test and publish relay
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'monolithoid/streamevent-relay' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example -f docker-compose.rtmps.yml config --quiet

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Hub repository
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REPOSITORY: ${{ env.DOCKERHUB_IMAGE }}
        shell: bash
        run: |
          if [[ ! "$IMAGE_REPOSITORY" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$ ]]; then
            echo '::error::Set the repository variable DOCKERHUB_IMAGE to your Docker Hub namespace/repository, without registry or tag.'
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: basket-relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test actual container before publication
        run: python tests/integration.py --image basket-relay:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streaming-validation
          path: test-results/
          retention-days: 7
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Pull requests build/test without needing any registry credentials.
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
